name: Build Sensor Domain Apps

on:
  workflow_dispatch:

jobs:
  # FE
  build-frontend:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22.x'
            cache: 'npm'
            cache-dependency-path: 'src/sensor-app/package.json'
        - name: Install dependencies
          working-directory: src/sensor-app
          run: npm ci
        - name: Lint
          working-directory: src/sensor-app
          run: npm run lint
        - name: Build
          working-directory: src/sensor-app
          run: npm run build
        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: sensor-app-dist
            path: src/sensor-app/dist/

  # API
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '10.0.x'
      - name: Restore API dependencies
        run: dotnet restore src/Sensor.API/Sensor.API.csproj
      - name: Build API
        run: dotnet build --no-restore src/Sensor.API/Sensor.API.csproj --configuration Release

  # INGESTOR
  build-ingestor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '10.0.x'
      - name: Restore Ingestor dependencies
        run: dotnet restore src/Sensor.Ingestor/Sensor.Ingestor.csproj
      - name: Build Ingestor
        run: dotnet build --no-restore src/Sensor.Ingestor/Sensor.Ingestor.csproj --configuration Release

  # PROCESSOR
  build-processor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '10.0.x'
      - name: Restore Processor dependencies
        run: dotnet restore src/Sensor.Processor/Sensor.Processor.csproj
      - name: Build Processor
        run: dotnet build --no-restore src/Sensor.Processor/Sensor.Processor.csproj --configuration Release

  # NOTIFICATION
  build-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '10.0.x'
      - name: Restore Notification dependencies
        run: dotnet restore src/Sensor.Notification/Sensor.Notification.csproj
      - name: Build Notification
        run: dotnet build --no-restore src/Sensor.Notification/Sensor.Notification.csproj --configuration Release

  # SHARED
  build-shared:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '10.0.x'
      - name: Restore Shared dependencies
        run: dotnet restore src/Shared/Shared.csproj
      - name: Build Shared
        run: dotnet build --no-restore src/Shared/Shared.csproj --configuration Release

  # API integration tests (Testcontainers requires Docker)
  test-api:
    needs: build-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run API integration tests
        run: dotnet test tests/Sensor.API.Tests/Sensor.API.Tests.csproj --configuration Release --verbosity normal

  # Processor unit tests
  test-processor:
    needs: build-processor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Processor unit tests
        run: dotnet test tests/Sensor.Processor.Tests/Sensor.Processor.Tests.csproj --configuration Release --verbosity normal

  # Notification unit tests
  test-notification:
    needs: build-notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Notification unit tests
        run: dotnet test tests/Sensor.Notification.Tests/Sensor.Notification.Tests.csproj --configuration Release --verbosity normal

  # SonarQube Analysis
  SonarQube:
    needs:
      - build-frontend
      - build-api
      - build-ingestor
      - build-processor
      - build-notification
      - build-shared
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"stas1408123_sensor-domain" /o:"stas1408123" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"